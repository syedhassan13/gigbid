name: ci
on: [push, pull_request]
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: No secrets in the repo
        run: |
          ! git ls-files | grep -E '(^|/)\.env$|kaggle\.json|access_token' || (echo "secret file committed" && exit 1)
          ! git grep -nE 'gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}' -- ':!*.md' || (echo "API key pattern found" && exit 1)
      - name: Nothing under gigsim/ changed (simulator frozen after v1 + the documented policy update)
        if: github.event_name == 'pull_request'
        run: git diff --exit-code origin/${{ github.base_ref }} -- gigsim/
      - name: Every prompt lives in agent/prompts/
        run: |
          ! grep -rnE '(system|prompt)\s*=\s*"""' agent/nodes rag || (echo "inline prompt found; move it to agent/prompts/" && exit 1)
      - name: README numbers trace to evals/results
        run: grep -q "generated by scripts/results_table.py" README.md
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check agent rag mcp_servers apps/api worker evals gigsim scripts --select E9,F63,F7,F82
      - name: Seed data
        run: python scripts/generate_personas.py && python scripts/prepare_data.py
      - name: Unit + MCP in-memory + contract (schema snapshot) tests
        env: { GIGBID_PROFILE: offline, PYTHONPATH: . }
        run: python -m pytest -q -m "not slow"
      - name: Slow tests (models + integration against GigSim)
        env: { GIGBID_PROFILE: offline, PYTHONPATH: . }
        run: python -m pytest -q -m slow
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: pip install -e .
      - run: cd apps/web && npm ci && npm run build && npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with: { path: "var/models\nvar/emb_cache", key: models-bge-small-v1 }
      - name: Warm embedding models and portfolio indexes (first analysis would otherwise exceed the e2e timeout)
        env: { GIGBID_PROFILE: offline, PYTHONPATH: . }
        run: |
          python scripts/generate_personas.py && python scripts/prepare_data.py
          python -c "from rag.retriever import retrieve; [retrieve('python api', p) for p in ('ai_ml','fullstack','data_analyst')]"
      - name: Start GigSim + API (serves the build)
        env: { GIGBID_PROFILE: offline, PYTHONPATH: ., REVIEWER_EMAIL: ci@gigbid.test, REVIEWER_PASSWORD: ci-password-123, GIGBID_AUTOSCOUT: "0", JWT_SECRET: ci }
        run: |
          nohup uvicorn gigsim.app:app --port 8100 > gigsim.log 2>&1 &
          nohup uvicorn apps.api.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8000/api/health && break; sleep 2; done
      - name: Playwright
        env: { E2E_EMAIL: ci@gigbid.test, E2E_PASSWORD: ci-password-123 }
        run: cd apps/web && npx playwright test
      - name: Server logs (on failure)
        if: failure()
        run: tail -n 80 api.log gigsim.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report }
