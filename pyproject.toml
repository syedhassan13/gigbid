[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid: a multi-agent freelancer copilot (LangGraph + MCP + advanced RAG). Includes the publishable gigbid-portfolio-mcp server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph==1.2.22",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langgraph-checkpoint-postgres==3.2.1",
  "langgraph-supervisor==0.0.31",
  "langchain-core==1.8.0",
  "langchain-mcp-adapters==0.3.2",
  "langchain-openai==1.8.0",
  "mcp==1.30.0",
  "fastapi==0.162.7",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "email-validator==2.3.0",
  "PyYAML==6.0.3",
  "rank-bm25==0.2.2",
  "numpy==2.5.4",
  "fastembed==0.9.1",
  "onnxruntime==1.32.0",
  "python-jose==3.5.0",
  "cryptography==50.0.2",
  "arq==0.28.0",
  "SQLAlchemy==2.1.8",
  "aiosqlite==0.22.1",
  "psycopg[binary]==3.3.9",
  "python-multipart==0.0.33",
  "sse-starlette==3.7.0",
  "scipy==1.18.1",
  "pypdf==7.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "kaggle==2.2.5", "ruff==0.8.4"]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "rag", "mcp_servers"]

[tool.hatch.build.targets.wheel.force-include]
"data/personas" = "data/personas"

[tool.ruff]
line-length = 150
target-version = "py311"
